<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CCC Quiz</title><meta name="theme-color" content="#5a45e6"><meta name="color-scheme" content="light">
<style>
/* ===================== CCC Quest — design tokens ===================== */
:root{
  --bg:#fff;--card:#fff;--tx:#14142b;--mu:#6b7280;--sep:#ececf3;--fill:#f3f4fb;--fill2:#ebe8ff;
  --bl:#6c5ce7;--bl2:#a55eea;--deep:#2b2370;
  --gr:#34c759;--rd:#ff3b30;--ok1:#20c997;--ok2:#12b886;
  --grb:rgba(32,201,151,.16);--rdb:rgba(255,59,48,.12);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light
}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#fff;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:none}
body{overflow-x:clip;scrollbar-width:none;overscroll-behavior:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;min-height:100%;background:#fff;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;touch-action:manipulation}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(108,92,231,.45);outline-offset:2px}

/* ===================== Screens ===================== */
.s{display:none;max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 112px}
.s.on{display:block;animation:tabin .32s var(--ease) backwards}
@keyframes tabin{from{opacity:0;transform:translate3d(var(--dx,40px),0,0)}}
.ni .s.on{animation:none!important}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
#home{padding-top:0}
h1{margin:6px 0 2px;font-size:2rem;font-weight:800;letter-spacing:-.02em;color:var(--deep)}
.sub{color:var(--mu);margin:0 0 18px;font-size:.95rem}
.s:not(#home):not(#quiz)>h1::before{content:"";display:block;width:34px;height:5px;border-radius:5px;margin-bottom:10px;background:linear-gradient(90deg,var(--bl),var(--bl2))}
#rep>h1::before{margin-inline:auto!important}
.note{text-align:center;color:var(--mu);font-size:.85rem;margin-top:18px}
.sec{display:flex;align-items:center;gap:8px;font-weight:800;margin:24px 4px 10px;font-size:.98rem;color:var(--deep)}
.sec svg{color:var(--bl)}

/* ===================== Buttons ===================== */
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:608px;margin:0 auto;border:0;background:var(--bl);color:#fff;font-size:1.05rem;font-weight:700;border-radius:16px;padding:14px;transition:transform .16s var(--ease),opacity .2s}
.btn:active{transform:scale(.98);opacity:.92}
.btn.g{background:var(--fill);color:var(--bl);margin-top:10px}
.btn.rd{background:var(--rdb);color:var(--rd)}
.btn.g.rd2{color:var(--rd);margin-top:0}
.btn.au::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3);transform-origin:left;animation:cd var(--t) linear forwards}
@keyframes cd{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.btn>*{position:relative}

.ic{position:relative;border:0;background:var(--fill);color:var(--bl);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .18s var(--ease),background-color .2s,color .2s}
.ic:active{transform:scale(.88)}
.ic.sm{width:32px;height:32px}
.ic svg,.nr button svg{display:block}
.ic.on{background:var(--bl);color:#fff}
#st.on,[id^=sb].on{background:#ff9f0a;color:#fff}
#st.on svg,[id^=sb].on svg{fill:currentColor}
#ls.on::after,#pa.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--bl);opacity:.5;animation:ring 1.2s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(1.55);opacity:0}}

/* ===================== Home header ===================== */
.hh{position:sticky;top:0;z-index:15;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;color:#fff;border-radius:0 0 28px 28px;overflow:hidden;will-change:transform;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.24),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(255,190,60,.25),transparent 50%),linear-gradient(135deg,#4a3bdc 0%,#7455ee 52%,#b266ee 100%);
  box-shadow:0 8px 24px rgba(88,66,220,.28)}
.hh>*{position:relative;z-index:1}
.hh-row{display:flex;align-items:center;gap:12px}
.lvb{--p:0;flex:none;width:52px;height:52px;border-radius:50%;padding:4px;background:conic-gradient(#ffd43b calc(var(--p)*1%),rgba(255,255,255,.28) 0);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.lvb div{width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#5a45e6,#8b5cf0);display:grid;place-items:center;font-weight:900;font-size:1.2rem;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.chp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:7px 13px;border-radius:20px;font-weight:800;font-size:1rem}
.chp svg{color:#ffd43b;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.cpill{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.12)}
.pgb{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.26);color:#fff;display:grid;place-items:center;transition:transform .2s var(--spring),opacity .25s,background-color .2s}
.pgb:active{transform:scale(.82)}
.pgb:disabled{opacity:.3;pointer-events:none}
.pgb.pv svg{transform:rotate(180deg)}
.pgt{flex:1;min-width:0;border:0;background:none;color:#fff;padding:0 4px;text-align:center;font-weight:800;font-size:.86rem;letter-spacing:.09em;white-space:nowrap;transition:transform .16s var(--ease)}
.pgt:active{transform:scale(.95)}
.pgt span{display:inline-block;animation:chn .42s var(--ease) backwards}
.pgt.r span{--cx:16px}.pgt.l span{--cx:-16px}
@keyframes chn{from{opacity:0;transform:translateX(var(--cx,0px))}}

/* ===================== Level map ===================== */
.map{position:relative;max-width:420px;margin:0 auto}
.map>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map.mr{animation:mpr .4s var(--ease)}.map.ml{animation:mpl .4s var(--ease)}
@keyframes mpr{from{opacity:0;transform:translateX(28px)}}
@keyframes mpl{from{opacity:0;transform:translateX(-28px)}}
.p0,.p1{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:2 16}
.p0{stroke:#e3e6f2}.p1{stroke:#20c997}
.wd{position:absolute;left:50%;transform:translateX(-50%);background:var(--a);color:#fff;font-weight:800;font-size:.75rem;padding:5px 14px;border-radius:14px;letter-spacing:.04em;z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.15);white-space:nowrap}
.nd{position:absolute;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:0;padding:0;color:#fff;font-size:1.7rem;font-weight:900;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 7px 0 rgba(0,0,0,.18),0 12px 20px rgba(0,0,0,.12);display:grid;place-items:center;z-index:3;transition:transform .15s var(--ease)}
.nd:active{transform:translate(-50%,-47%)}
.nd b{text-shadow:0 2px 0 rgba(0,0,0,.2)}
.nd svg{display:block;position:static}
.nd.lk{background:#d5d9e6;box-shadow:0 7px 0 #b8bdd0}
.nd.dn{background:linear-gradient(145deg,#20c997,#12b886);box-shadow:0 7px 0 #0b8f6a,0 12px 20px rgba(18,184,134,.25)}
.nd.cur::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:4px solid var(--a);opacity:.5;animation:ring 1.7s ease-out infinite;pointer-events:none}
.nd.shk{animation:ndsh .4s}
@keyframes ndsh{20%{transform:translate(calc(-50% - 6px),-50%)}40%{transform:translate(calc(-50% + 6px),-50%)}60%{transform:translate(calc(-50% - 4px),-50%)}80%{transform:translate(calc(-50% + 3px),-50%)}}
.tk{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:#fcc419;color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.sr{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.sr em{color:#dfe3ee;display:grid}
.sr em.on{color:#fcc419;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.go{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:#fff;color:var(--a);font-size:.72rem;font-weight:900;padding:5px 12px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.18);animation:bn 1.1s ease-in-out infinite}
.go::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
@keyframes bn{50%{transform:translateX(-50%) translateY(-6px)}}

/* ===================== Quiz ===================== */
#quiz.on{display:flex;flex-direction:column;position:relative;height:100vh;height:100dvh;padding:0;overflow:hidden}
.qtop{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
.nr{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.nr button{border:0;background:var(--fill);color:var(--tx);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .16s var(--ease)}
.nr button:active{transform:scale(.9)}
.nr button.on{background:var(--bl);color:#fff}
.qtop .nr button{background:#fff;box-shadow:0 2px 8px rgba(20,20,43,.1)}
#cnt{font-weight:800}
#scr{display:inline-flex;align-items:center;gap:4px;background:#fff;padding:6px 12px;border-radius:20px;font-size:.9rem;font-weight:700;color:var(--ok2);box-shadow:0 2px 8px rgba(20,20,43,.1)}
.fl{color:#ff9500;font-weight:700;display:inline-flex;align-items:center;gap:2px;margin-left:6px;animation:fd .3s}
.pr{height:8px;background:var(--sep);border-radius:8px;margin-top:10px;overflow:hidden}
.pr i{display:block;width:100%;height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#6c5ce7,#f06595);border-radius:8px;transition:transform .45s var(--ease)}
.qmid{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#card{background:none;box-shadow:none;border:0;padding:0;border-radius:0}
#card.an .qh,#card.an .qt{animation:qin .4s var(--ease) both}
@keyframes qin{from{opacity:0;transform:translateY(18px) scale(.98)}}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{background:#fff;color:var(--bl);font-weight:700;font-size:.75rem;padding:6px 12px;border-radius:14px;box-shadow:0 2px 8px rgba(20,20,43,.08)}
.tls{display:flex;gap:8px}
.tls .ic{background:#fff;box-shadow:0 2px 8px rgba(20,20,43,.1)}
.tls .ic.on{background:var(--bl)}
.tls #st.on{background:#ff9f0a}
.qt{margin:4px 0 14px;font-size:1.26rem;line-height:1.4;font-weight:800;background:#fff;padding:18px;border-radius:24px;box-shadow:0 8px 24px rgba(108,92,231,.14);border:1.5px solid rgba(108,92,231,.12);overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.o{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid transparent;background:#fff;color:var(--tx);padding:13px 14px;font-size:1rem;font-weight:700;border-radius:18px;box-shadow:0 3px 12px rgba(20,20,43,.08);transition:transform .16s var(--ease),border-color .2s,background-color .2s,opacity .2s}
#card.an .o{animation:up .42s var(--ease) backwards;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.o .bar{display:none}
.o:active:not(:disabled){transform:scale(.97);border-color:var(--bl)}
.o:disabled{cursor:default}
.o:disabled:not(.ok):not(.no){opacity:.55}
.o .tx{min-width:0;overflow-wrap:anywhere}
.c{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--fill);color:var(--bl);font-size:.9rem;font-weight:800;transition:background-color .2s,color .2s}
#card .o.ok{border-color:var(--ok2);background:#f0fdf9;box-shadow:0 0 0 4px rgba(32,201,151,.18);animation:glow .5s var(--ease)}
#card .o.no{border-color:var(--rd);background:#fff5f5;animation:sh .38s}
.o.ok .c{background:var(--ok2);color:#fff;animation:po .38s var(--spring)}
.o.no .c{background:var(--rd);color:#fff}
@keyframes glow{50%{transform:scale(1.025)}}
@keyframes po{from{transform:scale(.3)}}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#card.sh{animation:sh .4s}
.m{font-family:ui-monospace,"SF Mono",Menlo,monospace;background:var(--fill);padding:1px 8px;border-radius:7px;font-size:.88em}

/* bottom sheet (feedback) — slides with transform only, no layout work */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(20,20,43,.14);padding:14px 14px calc(12px + env(safe-area-inset-bottom,0px));max-height:78dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;will-change:transform}
.sheet.on{transform:none;visibility:visible;transition:transform .4s var(--ease),visibility 0s}
.fb{display:flex;align-items:center;gap:10px;font-size:1.05rem;border-radius:16px;padding:11px 14px}
.fb.g{background:linear-gradient(135deg,var(--ok1),var(--ok2));color:#fff}
.fb.r{background:linear-gradient(135deg,#ff6b6b,#ee5253);color:#fff}
.fb svg{flex:none}
.sheet .btn{margin-top:12px;max-width:none;background:linear-gradient(135deg,#6c5ce7,#a55eea);box-shadow:0 6px 16px rgba(108,92,231,.35)}
#hint .hint{margin:10px 0 0}
#fig .im{margin:10px 0 0;border-radius:16px}
#fig .im img{max-height:30vh;max-height:30dvh;width:100%;padding:6px;object-fit:contain}
#fig .im.ld{height:90px}
#fig .ic2{padding:4px 8px 6px}

/* ===================== Images / hints ===================== */
.im{margin-top:12px;border-radius:18px;background:#fff;border:.5px solid var(--sep);overflow:hidden;text-align:center;animation:fd .4s var(--ease);cursor:zoom-in;box-shadow:0 2px 10px rgba(20,20,43,.06)}
.im img{display:block;width:100%;max-height:270px;object-fit:contain;padding:16px;background:#fff}
.im .ic2{font-size:.72rem;color:#6b6b70;padding:7px 10px 10px;background:#fff;border-top:.5px solid #eee}
.im.ld{height:160px;position:relative;cursor:default}
.im .sk{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(120,120,130,.18) 50%,transparent 70%),var(--fill);background-size:200% 100%;animation:sm 1.2s linear infinite}
@keyframes sm{from{background-position:200% 0}to{background-position:-200% 0}}
.hint{display:flex;gap:9px;align-items:flex-start;margin:8px 4px 2px;padding:10px 12px;border-radius:12px;background:var(--fill);font-size:.84rem;line-height:1.45;animation:fd .3s var(--ease)}
.hint svg{flex:none;color:var(--bl);margin-top:2px}

/* ===================== Cards / lists ===================== */
.q{background:#fff;border-radius:20px;padding:14px 14px 10px;box-shadow:0 2px 10px rgba(20,20,43,.07)}
.q.sd{margin-bottom:12px;border-radius:18px;border:1px solid var(--sep);transition:box-shadow .3s;content-visibility:auto;contain-intrinsic-size:auto 150px}
.q.sd.pl{box-shadow:0 0 0 2.5px var(--bl)}
.lb{font-size:.74rem;color:var(--bl);font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px}
.lb span:last-child{color:var(--mu)}
.q h3{margin:0 0 10px;font-size:1.05rem;font-weight:700}
.tl{display:flex;justify-content:flex-end;gap:8px;margin:0 0 8px}
.ans{display:flex;align-items:center;gap:9px;background:var(--grb);color:#0b8f6a;border-radius:12px;padding:11px 12px;font-weight:700;font-size:.95rem}
.ans span{color:var(--tx)}
.card{background:#fff;border:1px solid var(--sep);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card h4{margin:0 0 10px;font-size:.95rem}
.st{display:flex;text-align:center}.st div{flex:1}.st b{display:block;font-size:1.5rem}.st span{color:var(--mu);font-size:.8rem}
.cr{margin:9px 0;font-size:.88rem}.cr div:first-child{display:flex;justify-content:space-between}
.cb{height:7px;background:var(--fill);border-radius:5px;margin-top:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--bl);border-radius:5px}
.w{padding:10px 0;border-top:.5px solid var(--sep);font-size:.88rem}
.w:first-of-type{border:0}.w p{margin:2px 0}
.w .y,.w .k{display:flex;align-items:center;gap:6px}
.w .y{color:var(--rd)}.w .k{color:#0b8f6a}
.bd{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:3px 12px;border-radius:12px;font-size:.8rem;color:#fff}
.pass{background:var(--gr)}.fail{background:var(--rd)}
.ft{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mu);padding:6px 4px 2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;color:var(--tx);border-radius:14px;padding:11px 16px;font-size:.9rem;font-weight:700;box-shadow:0 1px 4px rgba(20,20,43,.1);transition:transform .16s var(--ease),background-color .2s,color .2s}
.chips button:active{transform:scale(.94)}
.chips button.on{background:var(--bl);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb2{border:0;background:#fff;color:var(--tx);border-radius:16px;padding:16px 14px;text-align:left;box-shadow:0 2px 8px rgba(20,20,43,.08);border:1px solid var(--sep);transition:transform .16s var(--ease)}
.cb2:active{transform:scale(.96)}
.cb2 b{display:block;font-size:1rem}.cb2 span{color:var(--mu);font-size:.8rem}
.srch{width:100%;border:1px solid var(--sep);background:#fff;color:var(--tx);border-radius:14px;padding:12px 14px;font-size:1rem;margin-bottom:10px;outline:none;box-shadow:0 1px 4px rgba(20,20,43,.06)}
.srch:focus{border-color:var(--bl)}
.nrw{display:flex;gap:10px;align-items:baseline;background:#fff;border:1px solid var(--sep);padding:10px 14px;border-radius:12px;margin-bottom:6px;font-size:.88rem;line-height:1.35;content-visibility:auto;contain-intrinsic-size:auto 46px}
.nrw b{flex:none;min-width:84px;color:var(--bl)}
.nrw i{margin-left:auto;color:var(--mu);font-style:normal;font-size:.7rem;text-align:right;max-width:34%}
.nav{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.97);margin:calc(-18px - env(safe-area-inset-top,0px)) -14px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--sep)}
.nav .pr{margin-top:8px}

/* settings */
.set{background:#fff;border:1px solid var(--sep);border-radius:18px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:.5px solid var(--sep);font-size:.95rem}
.sw:first-child{border:0}
.sl{display:flex;align-items:center;gap:9px}
.sl svg{color:var(--bl)}
.tg{width:51px;height:31px;border-radius:16px;background:#d9dce8;border:0;position:relative;flex:none;transition:background-color .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.tg.on{background:var(--gr)}
.tg.on::after{transform:translateX(20px)}
.set .chips{gap:6px;justify-content:flex-end}
.set .chips button{box-shadow:none;background:var(--fill);padding:8px 12px;font-size:.8rem}
.set .chips button.on{background:var(--bl);color:#fff}
.sel{border:0;background:var(--fill);color:var(--tx);border-radius:10px;padding:8px 10px;font-size:.85rem;max-width:55%}
.pvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pvb{border:2px solid var(--sep);background:#fff;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx);font-size:.86rem;transition:transform .16s var(--ease),border-color .2s,background-color .2s}
.pvb:active{transform:scale(.95)}
.pvb small{font-size:.66rem;color:var(--mu)}

const dist=(pref,all,ex)=>{const u=x=>[...new Set(x)].filter(v=>v!=ex);let w=take(u(pref),3);if(w.length<3)w=w.concat(take(u(all).filter(v=>!w.includes(v)),3-w.length));return w};

const bits=b=>{const w=new Set();let g=0;while(w.size<3&&g++<60){const a=b.split(""),p=Math.floor(rnd()*a.length);a[p]=a[p]=="0"?"1":"0";const s=a.join("");if(s!=b)w.add(s)}return[...w]};
