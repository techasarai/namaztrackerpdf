<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Namaz Tracker - A4 Perfect Print Edition</title>
  
  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       BASE, RESET & HIDE SCROLLBARS
       ========================================= */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
       
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f172a; 
      width: 100vw; min-height: 100vh;
      overflow-x: hidden;
      -ms-overflow-style: none;  
      scrollbar-width: none;  
    }
    body::-webkit-scrollbar, div::-webkit-scrollbar {
      display: none; 
    }

    /* =========================================
       ROCK-SOLID VIEW ENGINE
       ========================================= */
    .view-section {
      position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
      transition: opacity 0.3s ease-in-out;
    }

    /* =========================================
       HOME VIEW (KEYBOARD JUMP & SHIFT LOCKED)
       ========================================= */
    #homeView {
      z-index: 10; background-color: #f0fdf4;
      display: block; 
      overflow-y: auto; overflow-x: hidden;
      width: 100%; min-height: 100vh;
      opacity: 0; 
    }

    /* FIXED PIXEL HEIGHT - Prevents keyboard-induced jumping in AppCreator24 */
    .app-header-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 210px;
      background: linear-gradient(135deg, #022c22, #047857, #10b981);
      border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
      z-index: 1; box-shadow: 0 10px 25px rgba(4, 120, 87, 0.2);
    }

    #inputContainer {
      background: rgba(255, 255, 255, 0.99); padding: 22px 18px; border-radius: 28px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 0 0 1px rgba(16, 185, 129, 0.1);
      width: 90%; max-width: 400px; text-align: center; 
      position: relative; z-index: 5; margin: 90px auto 40px auto; 
    }

    /* =========================================
       PREVIEW VIEW
       ========================================= */
    #previewView {
      z-index: 20; background: #0f172a; 
      display: none; 
      opacity: 0;
      overflow-y: auto; overflow-x: hidden;
      padding: 85px 10px 140px 10px;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }
    
    /* =========================================
       ROYAL SPLASH SCREEN
       ========================================= */
    #splashScreen {
      position: fixed; inset: 0; background: #011208; 
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.5s ease-out;
    }

    .splash-glow {
      position: absolute; width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(1, 18, 8, 0) 70%);
      border-radius: 50%; animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.15); opacity: 1; } }
    .splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; width: 100%; padding: 0 20px; }

    .svg-icon-wrapper { width: 110px; height: 110px; margin-bottom: 18px; display: flex; justify-content: center; align-items: center; }
    .splash-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0px 10px 20px rgba(253, 224, 71, 0.2)); }
    .svg-path { stroke-dasharray: 400; stroke-dashoffset: 400; fill-opacity: 0; animation: drawLine 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards, fillIcon 0.6s ease-out 0.8s forwards; }
    .ring-spin { transform-origin: 50px 50px; animation: spinRing 12s linear infinite; }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes fillIcon { to { fill-opacity: 1; filter: drop-shadow(0px 6px 12px rgba(253, 224, 71, 0.35)); } }
    @keyframes spinRing { to { transform: rotate(360deg); } }

    .text-container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; }
    .splash-title {
      font-family: 'Outfit', sans-serif; font-size: 1.85em; font-weight: 900; letter-spacing: 3px; margin: 0; padding: 0; text-transform: uppercase;
      background: linear-gradient(90deg, #FDE047, #ffffff, #FDE047); background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; opacity: 0; transform: translateY(12px);
      filter: drop-shadow(0px 0px 10px rgba(253, 224, 71, 0.4));
      animation: popUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards, shineText 3s linear infinite 1s;
    }
    .glowing-line {
      width: 0px; height: 2.5px; background: linear-gradient(90deg, transparent, #34D399, transparent); margin: 8px 0; border-radius: 5px;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); opacity: 0; animation: expandLine 0.6s ease-out 0.8s forwards;
    }
    .splash-subtitle {
      font-family: 'Poppins', sans-serif; color: #a7f3d0; font-size: 0.75em; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; 
      opacity: 0; text-shadow: 0 0 6px rgba(52, 211, 153, 0.5); animation: popUpFade 0.6s ease-out 0.9s forwards;
    }
    @keyframes shineText { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
    @keyframes popUpFade { to { opacity: 1; transform: translateY(0); } }
    @keyframes expandLine { to { width: 120px; opacity: 1; } }

    /* =========================================
       TOAST NOTIFICATION
       ========================================= */
    .custom-toast {
      position: fixed; top: 20px; left: 50%; transform: translate(-50%, -40px) scale(0.9);
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      color: #fff; padding: 10px 20px; border-radius: 40px; font-size: 0.85em; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); z-index: 10000; display: flex; align-items: center; gap: 8px;
      width: max-content; max-width: 90vw; opacity: 0; pointer-events: none;
      transition: transform 0.35s ease, opacity 0.25s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .custom-toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
    .toast-icon { width: 16px; height: 16px; color: #f87171; }

    /* =========================================
       HOME VIEW UI ELEMENTS
       ========================================= */
    .icon-top {
      width: 44px; height: 44px; background: #ecfdf5; border-radius: 12px; display: flex; justify-content: center; align-items: center;
      margin: 0 auto 10px auto; color: #047857; box-shadow: 0 6px 12px rgba(4, 120, 87, 0.15);
      position: relative; animation: floatIcon 3s ease-in-out infinite alternate;
    }
    @keyframes floatIcon { 0% { transform: translateY(0px); } 100% { transform: translateY(-3px); } }

    .main-heading { font-family: 'Outfit', sans-serif; color: #0f172a; font-size: 1.6em; font-weight: 800; margin-bottom: 2px; }
    .sub-heading { font-family: 'Poppins', sans-serif; color: #64748b; font-size: 0.78em; font-weight: 500; margin-bottom: 14px; line-height: 1.3; }

    textarea {
      width: 100%; height: 115px; padding: 12px; border-radius: 14px; border: 2px solid #e2e8f0; background: #f8fafc;
      font-family: monospace; font-size: 0.95em; resize: none; outline: none; font-weight: 600; margin-bottom: 14px; color: #0f172a;
      transition: all 0.25s ease; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }
    textarea:focus { border-color: #10b981; background: #ffffff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.12); }

    .btn-action { 
        position: relative; overflow: hidden;
        background: linear-gradient(135deg, #059669, #10b981); color: #fff; 
        font-family: 'Outfit', sans-serif; padding: 13px 20px; border: none; border-radius: 14px; 
        width: 100%; cursor: pointer; font-weight: 800; font-size: 1.05em;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); 
        transition: transform 0.1s ease; display: flex; justify-content: center; align-items: center; gap: 8px; letter-spacing: 0.5px;
    }
    .btn-action:active { transform: scale(0.96); }

    /* =========================================
       PREVIEW CONTROLS & PAGES
       ========================================= */
    .preview-controls {
        position: fixed; top: 12px; 
        left: 50%; transform: translateX(-50%);
        width: 92%; max-width: 380px; z-index: 1000; display: flex; justify-content: space-between; gap: 10px;
        background: rgba(30, 41, 59, 0.88); padding: 6px 10px; border-radius: 100px;
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .btn-secondary { 
        font-family: 'Outfit', sans-serif; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.05); 
        padding: 8px 14px; border-radius: 50px; flex: 1; font-weight: 700; font-size: 0.9em; cursor: pointer;
        transition: background 0.15s ease;
    }
    .btn-secondary:active { background: rgba(255,255,255,0.2); }

    .btn-primary { 
        font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #10b981, #047857); color: #fff; border: none; 
        padding: 8px 14px; border-radius: 50px; flex: 1.5; font-weight: 700; font-size: 0.9em; cursor: pointer;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); display: flex; justify-content: center; align-items: center; gap: 6px;
    }
    .btn-primary:active { transform: scale(0.96); }

    #printArea { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; margin: 0 auto; }
    
    /* =========================================
       SCREEN PREVIEW: A4 STYLING
       ========================================= */
    .page {
        width: 100%; 
        max-width: 750px; 
        aspect-ratio: 1 / 1.4142; /* Strict A4 proportion on screen */
        padding: 8px; 
        background: #fff; 
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        border-radius: 6px; 
        display: flex; flex-direction: column;
    }

    table { 
        width: 100%; 
        height: 100%; 
        border-collapse: collapse; 
        table-layout: fixed; 
        font-family: 'Poppins', sans-serif; 
        text-transform: uppercase;
    }
    
    th, td { border: 1.2px solid #cbd5e1; text-align: center; font-weight: 700; padding: 0; vertical-align: middle; }
    
    /* Slim Header on Screen */
    th { 
        background: #047857; color: #fff; 
        height: 30px; 
        font-size: clamp(9px, 2vw, 13px); 
    }
    
    td { 
        font-size: clamp(8px, 1.8vw, 11px); 
        color: #1e293b; 
    }
    
    .checkbox-mock { 
        width: clamp(10px, 2.5vw, 14px); 
        height: clamp(10px, 2.5vw, 14px); 
        border: 1.5px solid #cbd5e1; border-radius: 3px; 
        display: inline-flex; align-items: center; justify-content: center; 
        background: #f8fafc; margin: 0 auto; 
    }
    
    .checkbox-mock.checked { background: #10b981; border-color: #10b981; }
    .checkbox-mock.completed { background: #059669; border-color: #059669; }
    tr.completed-row td { background: #ecfdf5 !important; }
    .day-label { letter-spacing: 0.2px; color: #0f172a; font-weight: 800; }

    /* =========================================
       STRICT PRINT STYLES (100% FIXED FOR ANDROID)
       ========================================= */
    @media print {
        @page { size: A4 portrait; margin: 0; }
        
        body { background: #fff !important; margin: 0; padding: 0; overflow: visible !important; height: auto !important; width: auto !important; }
        
        #splashScreen, #homeView, .preview-controls, .custom-toast { display: none !important; }
        
        #previewView { display: block !important; position: static !important; background: #fff !important; padding: 0 !important; opacity: 1 !important; visibility: visible !important; overflow: visible !important; height: auto !important;}
        
        #printArea { display: block !important; gap: 0 !important; }
        
        /* EXACT Physical A4 Dimensions (No shrinking!) */
        .page { 
            width: 210mm !important; 
            height: 297mm !important;
            max-width: none !important; 
            aspect-ratio: auto !important; 
            padding: 8mm !important; 
            margin: 0 !important; 
            box-shadow: none !important; 
            border-radius: 0 !important; 
            page-break-after: always !important; 
            page-break-inside: avoid !important; 
        }
        
        table { height: 100% !important; width: 100% !important; border-collapse: collapse !important; }
        thead { display: table-header-group !important; }
        tbody { display: table-row-group !important; }
        tr { page-break-inside: avoid !important; break-inside: avoid !important; }
        
        /* Big, Bold & Highly Visible Text in Print */
        th { 
            font-size: 14px !important; 
            height: 35px !important; 
        } 
        
        td { 
            font-size: 13px !important; 
            height: auto !important; /* Table automatically perfectly distributes rows */
        }
        .day-label { font-size: 13.5px !important; }
        
        .checkbox-mock { width: 16px !important; height: 16px !important; border-width: 1.5px !important; }
        
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  
/* ===== ROBUST JSON UPLOAD UI ===== */

<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="custom-toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span id="toastMessage">Error Message</span>
  </div>

  <!-- ROYAL SPLASH SCREEN -->
  <div id="splashScreen">
    <div class="splash-glow"></div>
    <div class="splash-content">
      <div class="svg-icon-wrapper">
        <svg class="splash-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FDE047" /><stop offset="100%" stop-color="#D97706" />
            </linearGradient>
            <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#34D399" /><stop offset="100%" stop-color="#047857" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="45" stroke="url(#goldGradient)" stroke-width="0.8" stroke-dasharray="3 5" fill="none" class="ring-spin"/>
          <path class="svg-path" d="M 50,15 A 35,35 0 1,0 85,50 A 30,30 0 1,1 50,15 Z" stroke="url(#goldGradient)" stroke-width="1.5" fill="url(#goldGradient)" stroke-linejoin="round"/>
          <path class="svg-path" d="M 38 68 C 38 52, 44 48, 50 40 C 56 48, 62 52, 62 68 Z" stroke="url(#emeraldGradient)" stroke-width="1.5" fill="url(#emeraldGradient)" stroke-linejoin="round"/>
          <path class="svg-path" d="M 36 68 L 64 68 Z" stroke="url(#emeraldGradient)" stroke-width="2.5" stroke-linecap="round"/>
          <line class="svg-path" x1="50" y1="40" x2="50" y2="25" stroke="url(#emeraldGradient)" stroke-width="2" stroke-linecap="round"/>
          <path class="svg-path" d="M 50 30 L 51 32.5 L 53.5 32.5 L 51.5 34 L 52.5 36.5 L 50 35 L 47.5 36.5 L 48.5 34 L 46.5 32.5 L 49 32.5 Z" fill="url(#goldGradient)" stroke="none" style="animation-delay: 0.5s; opacity: 0;"/>
        </svg>
      </div>
      <div class="text-container">
        <h1 class="splash-title">NAMAZ TRACKER</h1>
        <div class="glowing-line"></div>
        <p class="splash-subtitle">PDF GENERATOR</p>
      </div>
    </div>
  </div>

  <!-- HOME VIEW -->
  <div id="homeView" class="view-section">
      <div class="app-header-bg"></div>

      <div id="inputContainer">
        <div class="icon-top">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>

        <h1 class="main-heading">JSON → PDF</h1>
        <p class="sub-heading">Upload your Namaz Tracker .json backup to create your A4 tracker PDF.</p>

        <input id="jsonFile" type="file" accept=".json,application/json,text/json" hidden>

        <div id="fileDropZone" class="upload-zone" role="button" tabindex="0"
             aria-label="Upload Namaz Tracker JSON file">
          <div class="upload-icon">↑</div>
          <div class="upload-title">UPLOAD JSON FILE</div>
          <div class="upload-subtitle">Tap here to select your Namaz Tracker backup.json file</div>
          <div id="selectedFileName" class="selected-file">No file selected</div>
        </div>

        <button id="generateBtn" class="btn-action" type="button" disabled>
          GENERATE PDF
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
  </div>

  <!-- PREVIEW VIEW -->
  <div id="previewView" class="view-section">
    <div class="preview-controls">
        <button class="btn-secondary" onclick="closePreview()">Cancel</button>
        <button class="btn-primary" onclick="handlePrint()">
            Print File
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
        </button>
    </div>
    
    <div id="printArea"></div>
  </div>

  <script>
(function () {
  "use strict";

  let selectedJsonFile = null;
  let toastTimer = null;

  const $ = (id) => document.getElementById(id);

  function showToast(message) {
    const toast = $("toastNotification");
    const msg = $("toastMessage");
    if (!toast || !msg) return;
    msg.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
  }

  function openPicker() {
    const input = $("jsonFile");
    if (input) input.click();
  }

  function validJsonFile(file) {
    if (!file) return false;
    const name = String(file.name || "").toLowerCase();
    const type = String(file.type || "").toLowerCase();
    return name.endsWith(".json") ||
           type === "application/json" ||
           type === "text/json" ||
           type === "";
  }

  function fiveNamaz(value) {
    if (Array.isArray(value)) {
      return Array.from({ length: 5 }, (_, i) =>
        value[i] === true || value[i] === 1 || value[i] === "true"
      );
    }

    // Compatibility for numeric bit-mask values.
    if (typeof value === "number" && Number.isFinite(value)) {
      return [0, 1, 2, 3, 4].map(i => (value & (1 << i)) !== 0);
    }

    return [false, false, false, false, false];
  }

  function getState(payload) {
    if (!payload || typeof payload !== "object") return null;

    if (payload.namazState && typeof payload.namazState === "object") {
      return payload.namazState;
    }

    // Also accept a direct date-keyed JSON object.
    const dateKeys = Object.keys(payload).filter(k =>
      /^\d{4}-\d{1,2}-\d{1,2}$/.test(k)
    );
    return dateKeys.length ? payload : null;
  }

  function makeMonths(state) {
    const months = new Map();

    Object.keys(state).forEach(key => {
      const match = key.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!match) return;

      const year = Number(match[1]);
      const month = Number(match[2]); // Namaz Tracker export uses 0 = January
      const day = Number(match[3]);

      if (!Number.isInteger(year) ||
          !Number.isInteger(month) || month < 0 || month > 11 ||
          !Number.isInteger(day) || day < 1) return;

      const maxDay = new Date(year, month + 1, 0).getDate();
      if (day > maxDay) return;

      const monthKey = year + "-" + String(month).padStart(2, "0");

      if (!months.has(monthKey)) {
        months.set(monthKey, {
          year,
          month,
          days: new Map()
        });
      }

      months.get(monthKey).days.set(day, fiveNamaz(state[key]));
    });

    return Array.from(months.values()).sort(
      (a, b) => a.year - b.year || a.month - b.month
    );
  }

  function checkMarkup(checked) {
    return checked
      ? '<span class="checkbox-mock checked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>'
      : '<span class="checkbox-mock"></span>';
  }

  function renderPDF(state, profileName) {
    const printArea = $("printArea");
    if (!printArea) throw new Error("PDF preview area not found.");

    const months = makeMonths(state);
    if (!months.length) {
      throw new Error("No valid Namaz records found in this JSON file.");
    }

    printArea.innerHTML = "";
    let includedMonths = 0;

    months.forEach(info => {
      // A month is included when at least ONE day has at least one checked box.
      const monthHasAnyTick = Array.from(info.days.values())
        .some(values => values.some(Boolean));

      if (!monthHasAnyTick) return;

      includedMonths++;

      const page = document.createElement("div");
      page.className = "page";

      const table = document.createElement("table");
      table.className = "namaz-table";
      table.innerHTML = `
        <colgroup>
          <col class="date-column">
          <col class="namaz-column">
          <col class="namaz-column">
          <col class="namaz-column">
          <col class="namaz-column">
          <col class="namaz-column">
        </colgroup>
        <thead>
          <tr>
            <th>DATE</th>
            <th>फज्र</th>
            <th>जुहर</th>
            <th>असर</th>
            <th>मगरिब</th>
            <th>ईशा</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;

      const tbody = table.querySelector("tbody");
      const daysInMonth = new Date(info.year, info.month + 1, 0).getDate();

      // COMPLETE month data: every day of an included month is shown.
      for (let day = 1; day <= daysInMonth; day++) {
        const values = info.days.get(day) || [false, false, false, false, false];

        const row = document.createElement("tr");
        if (values.every(Boolean)) row.classList.add("completed-row");

        const dateCell = document.createElement("td");
        const date = new Date(info.year, info.month, day);
        const dayText = String(day).padStart(2, "0");
        const monthText = date.toLocaleDateString("en-US", {
          month: "short"
        }).toUpperCase();

        // Exact requested format: 01 AUG 2025
        dateCell.textContent = `${dayText} ${monthText} ${info.year}`;
        dateCell.className = "date-cell";
        row.appendChild(dateCell);

        values.forEach(checked => {
          const cell = document.createElement("td");
          cell.className = "namaz-cell";
          cell.innerHTML = checkMarkup(checked);
          row.appendChild(cell);
        });

        tbody.appendChild(row);
      }

      // No month title/text above the table.
      page.appendChild(table);
      printArea.appendChild(page);
    });

    if (!includedMonths) {
      throw new Error("No checked Namaz records found in this JSON file.");
    }

    document.title = profileName
      ? "Namaz Report - " + profileName
      : "Namaz Report";
  }

  function showPreview() {
    const home = $("homeView");
    const preview = $("previewView");

    if (home) {
      home.style.opacity = "0";
      setTimeout(() => { home.style.display = "none"; }, 180);
    }

    if (preview) {
      preview.style.display = "block";
      requestAnimationFrame(() => {
        preview.style.opacity = "1";
        preview.scrollTop = 0;
        window.scrollTo(0, 0);
      });
    }
  }

  function closePreview() {
    const preview = $("previewView");
    const home = $("homeView");

    if (preview) {
      preview.style.opacity = "0";
      setTimeout(() => { preview.style.display = "none"; }, 180);
    }

    if (home) {
      setTimeout(() => {
        home.style.display = "block";
        requestAnimationFrame(() => home.style.opacity = "1");
        window.scrollTo(0, 0);
      }, 190);
    }
  }

  function handlePrint() {
    if (!$("printArea") || !$("printArea").children.length) {
      showToast("Please upload a JSON file first.");
      return;
    }
    setTimeout(() => window.print(), 80);
  }

  async function generateFromFile(file) {
    if (!file) {
      showToast("Please select your Namaz Tracker .json file.");
      return;
    }

    if (!validJsonFile(file)) {
      showToast("Only a .json backup file is supported.");
      return;
    }

    const button = $("generateBtn");
    const nameEl = $("selectedFileName");

    try {
      if (button) button.disabled = true;
      if (nameEl) nameEl.textContent = "Reading " + file.name + "…";

      const raw = await file.text();
      if (!raw.trim()) throw new Error("The JSON file is empty.");

      let payload;
      try {
        payload = JSON.parse(raw);
      } catch (_) {
        throw new Error("Invalid JSON. Please upload the original Namaz Tracker backup.json.");
      }

      const state = getState(payload);
      if (!state) {
        throw new Error('This file does not contain "namazState".');
      }

      const profileName =
        typeof payload.profileName === "string"
          ? payload.profileName.trim()
          : "";

      renderPDF(state, profileName);

      if (nameEl) {
        nameEl.textContent = "✓ " + file.name + " • Ready";
      }

      showPreview();
    } catch (error) {
      console.error(error);
      if (nameEl) nameEl.textContent = "No file selected";
      if ($("jsonFile")) $("jsonFile").value = "";
      selectedJsonFile = null;
      showToast(error.message || "Unable to read the JSON file.");
    } finally {
      if (button) button.disabled = !selectedJsonFile;
    }
  }

  function initUploader() {
    const input = $("jsonFile");
    const zone = $("fileDropZone");
    const button = $("generateBtn");

    if (!input || !zone || !button) {
      console.error("JSON uploader elements missing.");
      return;
    }

    zone.addEventListener("click", openPicker);

    zone.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openPicker();
      }
    });

    input.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      selectedJsonFile = file;
      $("selectedFileName").textContent = "Selected: " + file.name;
      button.disabled = false;
    });

    button.addEventListener("click", () => {
      if (selectedJsonFile) {
        generateFromFile(selectedJsonFile);
      } else {
        openPicker();
      }
    });

    ["dragenter", "dragover"].forEach(type => {
      zone.addEventListener(type, event => {
        event.preventDefault();
        zone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(type => {
      zone.addEventListener(type, event => {
        event.preventDefault();
        zone.classList.remove("dragover");
      });
    });

    zone.addEventListener("drop", event => {
      const file = event.dataTransfer &&
                   event.dataTransfer.files &&
                   event.dataTransfer.files[0];

      if (!file) return;

      if (!validJsonFile(file)) {
        showToast("Please drop a .json backup file.");
        return;
      }

      selectedJsonFile = file;
      $("selectedFileName").textContent = "Selected: " + file.name;
      button.disabled = false;

      // Dropped files generate immediately.
      generateFromFile(file);
    });
  }

  window.closePreview = closePreview;
  window.handlePrint = handlePrint;

  window.addEventListener("load", () => {
    const splash = $("splashScreen");
    const home = $("homeView");

    initUploader();

    setTimeout(() => {
      if (splash) splash.style.opacity = "0";
      if (home) {
        home.style.display = "block";
        requestAnimationFrame(() => home.style.opacity = "1");
      }

      setTimeout(() => {
        if (splash) splash.style.display = "none";
      }, 500);
    }, 900);
  });
})();
</script>
</body>
</html>
